<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta do Clima</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1f5c99">

    <!-- ÍCONES -->
    <link
        rel="icon"
        type="image/jpeg"
        href="https://i.pinimg.com/736x/e1/a0/b5/e1a0b54a5fdc5b60a311bff7a60b5fe0.jpg"
    >

    <link
        rel="apple-touch-icon"
        href="https://i.pinimg.com/736x/cd/0c/f0/cd0cf01711128fa8c53dd6e7269443ab.jpg"
    >

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>

<body>

    <main class="container">

        <div class="card">

            <div id="offlineAviso" class="offline">
                🔴 Você está sem conexão.
                Algumas funções podem não funcionar.
            </div>

            <h1>Consulta do Clima</h1>

            <label for="cidade">
                Digite uma cidade:
            </label>

            <input
                type="text"
                id="cidade"
                placeholder="Ex.: Lages"
                autocomplete="off"
            >

            <button id="buscar" type="button">
                Buscar clima
            </button>

            <section id="resultado">
            </section>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
