<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta do Clima</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">

    <!-- PWA -->
    <link rel="manifest" href="./manifest.json">

    <!-- Cor do aplicativo -->
    <meta name="theme-color" content="#1f5c99">

    <!-- Ícone principal -->
    <link
        rel="icon"
        type="image/png"
        sizes="192x192"
        href="./icons/icon-192.png"
    >

    <!-- Ícone maior -->
    <link
        rel="icon"
        type="image/png"
        sizes="512x512"
        href="./icons/icon-512.png"
    >

    <!-- Ícone para celulares -->
    <link
        rel="apple-touch-icon"
        href="./icons/icon-192.png"
    >

    <!-- Permite instalação como aplicativo -->
    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

</head>

<body>

    <main class="container">

        <div class="card">

            <!-- Aviso de conexão -->
            <div id="offlineAviso" class="offline">
                🔴 Você está sem conexão.
                Algumas funções podem não funcionar.
            </div>

            <!-- Título -->
            <h1>Consulta do Clima</h1>

            <!-- Campo da cidade -->
            <label for="cidade">
                Digite uma cidade:
            </label>

            <input
                type="text"
                id="cidade"
                placeholder="Ex.: Lages"
                autocomplete="off"
            >

            <!-- Botão -->
            <button
                id="buscar"
                type="button"
            >
                Buscar clima
            </button>

            <!-- Resultado -->
            <section id="resultado">
            </section>

        </div>

    </main>

    <!-- JavaScript -->
    <script src="./script.js"></script>

</body>

</html>
